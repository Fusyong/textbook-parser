# book_code → 槽位级元数据（与学期批次无关）。
# 各批 material/{batch}/ 内的 PDF / 版式 md 按「×年级×册」关键词自动匹配；
# 可选 pdf: 指定该槽优先使用的文件名（须存在于对应批次目录）。
# toc_csv 仅用于非识字表/写字表/词语表的遗留场景；识字表等已与 output/{batch}/{book}_目录.json 对齐。
# toc_columns: 目录版式栏数；一年级上下册为 1（单栏），其余默认 2（双栏）
# 目录版心 toc_content_width_han 默认见 configs/defaults.yaml；仅当某册与默认不同时再在本文件对应条目下书写。
book_code:
  b11:
    toc_columns: 1
    extractors_drop:
      - 词语表
  b12:
    toc_columns: 1
    extractors_drop:
      - 词语表
  b21: {}
  b22: {}
  b31: {}
  b32: {}
  b41: {}
  b42: {}
  b51: {}
  b52: {}
  b61:
    # 本册版式文本中无独立「识字表」附录（仅有写字表、词语表），勿运行该提取器。
    extractors_drop:
      - 识字表
  b62:
    extractors_drop:
      - 识字表
